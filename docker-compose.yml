
services:
  postgres:
    image: postgres:15
    container_name: angunet_db
    restart: always
    env_file:
      - api/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: dotnet_api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_WATCH_POLLING_INTERVAL=true
      - ASPNETCORE_URLS=http://+:5199
    env_file:
      - api/.env
    ports:
      - "5046:5199"
    volumes:
      - ./api:/app
      - /app/bin
      - /app/obj
    depends_on:
      - postgres
  front:
    environment:
    - CHOKIDAR_USEPOLLING=true
    build:
      context: ./front
      dockerfile: Dockerfile
    volumes:
      - ./front:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      - api
volumes:
  postgres_data:

