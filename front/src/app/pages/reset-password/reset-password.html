<div class="flex flex-col items-center justify-center h-screen">

    <div class="w-1/3 shadow-md bg-surface-container rounded-2xl">
        <h1 class="text-4xl p-5">Reset Password</h1>
        <form [formGroup]="form" (ngSubmit)="onSubmit()">

            @if(!isNewPasswordFieldsVisible()){

            <div class="m-5">
                <app-email-verificator (verified)="showNewPasswordFileds($event)" />
            </div>
            }
            @else{
            <div class="p-5">
                <app-input-field [control]="$any(form.get('password'))" [data]="{
                                label:'New password',
                                type:'password',
                                name:'new_password',
                                icon:'lock',
                            }" />
                <app-input-field [control]="$any(form.get('password'))" [data]="{
                        
                            label:'Confirm New password',
                            type:'password',
                            name:'confirm_password',
                            icon:'lock',
                        }" />
                <button matButton="filled">Save New Password</button>
            </div>
            }
        </form>
        <div class="flex justify-between items-center mt-5 p-5">
            <a routerLink="/" class="text-secondary hover:text-tertiary">login</a>
            <a routerLink="/register" class="text-secondary hover:text-tertiary">register</a>
        </div>
    </div>
</div>
