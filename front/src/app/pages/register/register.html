<div class="flex flex-col items-center justify-center h-screen">

    <div class="w-1/3 shadow-md bg-surface-container rounded-2xl">
        <div class="p-5">
            <!-- <mat-spinner></mat-spinner> -->
            <h1 class="text-4xl mb-8">New User creation</h1>
            <form [formGroup]="form" class="flex flex-col gap-5" (ngSubmit)="onSubmit()">
                @if(!canShowRegisterForm()){
                    <app-email-verificator [isFieldDisabled]="canShowRegisterForm()"
                    (verified)="confirmEmail($event)" />
                }
                @if(canShowRegisterForm()){

                <app-input-field [control]="$any(form.get('fullName'))" [data]="{
                            label:'full Name',
                            type:'text',
                            name:'fullName',
                            icon:'account_circle',
                        }" />
                <app-input-field [control]="$any(form.get('password'))" [data]="{
                    label:'password',
                    type:'password',
                    name:'password',
                    icon:'lock',
                }" />
                <app-input-field [control]="$any(form.get('confirm_password'))" [data]="{
                    label:'confirm password',
                    type:'password',
                    name:'confirm_password',
                    icon:'lock',
                }" />

                }
                <div class="flex justify-between items-center">
                    <button matButton="filled" [disabled]="form.invalid">
                        <mat-icon>person_add</mat-icon>
                    </button>
                    <a routerLink="/" class="text-secondary hover:text-tertiary">login</a>
                </div>
            </form>
        </div>
    </div>
</div>
