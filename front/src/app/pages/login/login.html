<div class="flex flex-col items-center justify-center h-screen">

    <div class="w-1/3 shadow-md bg-surface-container rounded-2xl">
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="mt-5 p-5">
                <app-input-field [control]="$any(form.get('email'))" [data]="{
                    label:'email',
                    type:'email',
                    name:'email',
                    icon:'mail',
                }" />
                <app-input-field [control]="$any(form.get('password'))" [data]="{
                    label:'password',
                    type:'password',
                    name:'password',
                    icon:'lock',
                }" />
                <span class="flex items-center justify-between">
                    <button matButton="filled" [disabled]="!form.valid">
                        <mat-icon>login</mat-icon>
                    </button>
                    <a routerLink="/reset-password" class="text-secondary hover:text-tertiary"> forgot your password
                        ?</a>
                    <a routerLink="/register" class="text-secondary hover:text-tertiary">Register new Account</a>
                </span>
            </div>
        </form>
    </div>
</div>
